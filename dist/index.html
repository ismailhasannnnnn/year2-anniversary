<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1741" />
    <title>Tomi's Anniversary Adventure</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar"><span class="brand">Tomi's Adventure</span><button id="sound" class="quiet-button" aria-pressed="false">Sound: off</button></header>
      <section class="memory-box" aria-label="Memory box"><span class="memory-label">Memory box</span><div class="keepsakes"><span id="keep-popcorn" title="Circus popcorn">○</span><span id="keep-portrait" title="Family portrait">○</span><span id="keep-ticket" title="Concert ticket">○</span></div></section>
      <section id="scene" class="scene opening" aria-live="polite">
        <div class="sky-dots"></div>
        <div class="tomi" aria-hidden="true"><div class="tomi-tail">✦</div><div class="tomi-face">•ᴗ•</div></div>
        <div id="scene-art"></div>
      </section>
      <section class="dialogue" aria-labelledby="speaker">
        <p id="chapter" class="chapter">A tiny mission</p>
        <h1 id="speaker">Tomi</h1>
        <p id="copy">Hi!!! I have important anniversary business. We need three very good memories for the box.</p>
        <div id="actions" class="actions"><button class="primary" data-action="start">Open the memory box</button></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
